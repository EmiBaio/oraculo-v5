  <!-- Puente de Alias y Verificador de Carga de los 22 Arcanos -->
  <script>
    (function verifyAndMapArcanaRegistry() {
      const reg = window.ARCANA_REGISTRY = window.ARCANA_REGISTRY || {};
      const aliasGroups = [
        ["fool", "el_loco", "loco", "0", "00", "major_0", "maj_0"],
        ["magician", "el_mago", "la_maga", "mago", "I", "1", "major_1", "maj_1"],
        ["priestess", "high_priestess", "la_sacerdotisa", "la_papisa", "II", "2", "major_2", "maj_2"],
        ["empress", "la_emperatriz", "III", "3", "major_3", "maj_3"],
        ["emperor", "el_emperador", "IV", "4", "major_4", "maj_4"],
        ["hierophant", "el_hierofante", "el_papa", "pope", "V", "5", "major_5", "maj_5"],
        ["lovers", "los_enamorados", "los_amantes", "VI", "6", "major_6", "maj_6"],
        ["chariot", "el_carro", "VII", "7", "major_7", "maj_7"],
        ["strength", "fortitude", "la_fuerza", "VIII", "8", "major_8", "maj_8"],
        ["hermit", "el_ermitano", "el_ermitaño", "IX", "9", "major_9", "maj_9"],
        ["wheel", "wheel_of_fortune", "fortune", "la_rueda", "la_rueda_de_la_fortuna", "X", "10", "major_10", "maj_10"],
        ["justice", "la_justicia", "XI", "11", "major_11", "maj_11"],
        ["hanged", "hanged_man", "el_colgado", "XII", "12", "major_12", "maj_12"],
        ["death", "la_muerte", "XIII", "13", "major_13", "maj_13"],
        ["temperance", "la_templanza", "XIV", "14", "major_14", "maj_14"],
        ["devil", "el_diablo", "XV", "15", "major_15", "maj_15"],
        ["tower", "la_torre", "XVI", "16", "major_16", "maj_16"],
        ["star", "la_estrella", "XVII", "17", "major_17", "maj_17"],
        ["moon", "la_luna", "XVIII", "18", "major_18", "maj_18"],
        ["sun", "el_sol", "XIX", "19", "major_19", "maj_19"],
        ["judgement", "judgment", "el_juicio", "XX", "20", "major_20", "maj_20"],
        ["world", "el_mundo", "XXI", "21", "major_21", "maj_21"]
      ];
      const missing = [];
      aliasGroups.forEach(function (group) {
        const found = group.map(function (k) { return reg[k]; }).find(Boolean);
        if (found) {
          group.forEach(function (k) { reg[k] = found; });
        } else {
          missing.push(group[1] + ".js");
        }
      });
      if (missing.length === 0) {
        console.log("%c✦ [CARTA.HTML] Los 22 Arcanos Mayores AAA + 12 Volúmenes del Grimorio están activos.", "color: #fde047; font-weight: bold;");
      } else {
        console.warn("⚠️ Faltan cargar o tienen otro nombre en /cartas/ los siguientes archivos:", missing);
      }
    })();
  </script>

  <!-- 6. Arranque Blindado de la Aplicación (Compatible 100% con file:///) -->
  <script>
    (function mountCartaApp() {
      const { useState, useEffect } = React;

      function cleanSlug(str) {
        return String(str || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
      }

      function getUnifiedPool() {
        if (window.TAROT_DB) {
          if (typeof window.TAROT_DB.getAllCards === "function") return window.TAROT_DB.getAllCards();
          if (Array.isArray(window.TAROT_DB.all) && window.TAROT_DB.all.length > 0) return window.TAROT_DB.all;
        }
        const majors = window.MAJOR_ARCANA || (typeof MAJOR_ARCANA !== "undefined" ? MAJOR_ARCANA : []);
        const minors = window.MINOR_ARCANA || (typeof MINOR_ARCANA !== "undefined" ? MINOR_ARCANA : []);
        return majors.concat(minors);
      }

      if (!window.TarotRouter) {
        window.TarotRouter = {};
      }

      if (typeof window.TarotRouter.getCard !== "function") {
        window.TarotRouter.getCard = function (query) {
          const pool = getUnifiedPool();
          if (!pool || pool.length === 0) return null;
          if (query === null || query === undefined || query === "") return pool[0];

          const q = String(query).toLowerCase().trim();
          const qSlug = cleanSlug(q);

          const directMatch = pool.find(function (c) {
            return (
              String(c.id).toLowerCase() === q ||
              (c.slug && c.slug === qSlug) ||
              cleanSlug(c.name) === qSlug
            );
          });
          if (directMatch) return directMatch;

          if (window.TAROT_DB && typeof window.TAROT_DB.getCardByQuery === "function") {
            return window.TAROT_DB.getCardByQuery(query);
          }

          return (
            pool.find(function (c) {
              return cleanSlug(c.name).indexOf(qSlug) !== -1;
            }) || pool[0]
          );
        };
      }

      if (typeof window.TarotRouter.getNeighbors !== "function") {
        window.TarotRouter.getNeighbors = function (card) {
          const pool = getUnifiedPool();
          if (!card || !pool || pool.length === 0) return { prev: null, next: null, related: [] };

          if (window.TAROT_DB && typeof window.TAROT_DB.getNeighbors === "function") {
            const dbNeighbors = window.TAROT_DB.getNeighbors(card.id);
            const rootElem = card.rootElement || "Aire";
            const relatedList = pool
              .filter(function (c) {
                return String(c.id) !== String(card.id) && (c.rootElement === rootElem || (c.correspondences && String(c.correspondences.element).indexOf(rootElem) !== -1));
              })
              .slice(0, 4);

            return {
              prev: dbNeighbors.prev,
              next: dbNeighbors.next,
              sameElement: dbNeighbors.sameElement || relatedList[0] || dbNeighbors.next,
              related: dbNeighbors.related || relatedList
            };
          }

          const idx = pool.findIndex(function (c) {
            return String(c.id) === String(card.id);
          });
          const prev = idx !== -1 ? pool[(idx - 1 + pool.length) % pool.length] : pool[0];
          const next = idx !== -1 ? pool[(idx + 1) % pool.length] : pool[1];
          const related = pool.filter(function (c) { return String(c.id) !== String(card.id); }).slice(0, 4);

          return { prev: prev, next: next, sameElement: related[0], related: related };
        };
      }

      if (typeof window.TarotRouter.resolveCurrentUrl !== "function") {
        window.TarotRouter.resolveCurrentUrl = function (defaultId) {
          const fallback = defaultId !== undefined ? defaultId : "11";
          const params = new URLSearchParams(window.location.search);
          const requested = params.get("arcano") || params.get("id") || fallback;
          const isShadow = params.get("modo") === "sombra" || params.get("invertida") === "1";

          const baseCard = this.getCard(requested);
          const resolvedCard =
            window.TAROT_DB && typeof window.TAROT_DB.resolveCardForDraw === "function"
              ? window.TAROT_DB.resolveCardForDraw(baseCard, isShadow, false)
              : baseCard;

          return {
            card: resolvedCard || baseCard,
            neighbors: this.getNeighbors(baseCard)
          };
        };
      }

      if (typeof window.TarotRouter.getLink !== "function") {
        window.TarotRouter.getLink = function (cardOrId) {
          const id = typeof cardOrId === "object" && cardOrId !== null ? cardOrId.id : cardOrId;
          return "?arcano=" + encodeURIComponent(id);
        };
      }

      if (typeof window.TarotRouter.navigateTo !== "function") {
        window.TarotRouter.navigateTo = function (cardOrId) {
          const url = this.getLink(cardOrId);
          window.history.pushState({}, "", url);
          window.dispatchEvent(new PopStateEvent("popstate"));
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
      }

      function resolveRouteSafe() {
        return window.TarotRouter.resolveCurrentUrl("11");
      }

      function AppCarta() {
        const [routeData, setRouteData] = useState(resolveRouteSafe);

        useEffect(function () {
          function handleUrlChange() {
            setRouteData(resolveRouteSafe());
          }
          window.addEventListener("popstate", handleUrlChange);
          return function () {
            window.removeEventListener("popstate", handleUrlChange);
          };
        }, []);

        useEffect(function () {
          if (routeData && routeData.card) {
            document.title =
              (routeData.card.seo && routeData.card.seo.title) ||
              routeData.card.seoTitle ||
              (routeData.card.name + " • Oráculo del Velo Astral");
          }
        }, [routeData]);

        if (!routeData || !routeData.card) {
          return React.createElement(
            "div",
            { className: "min-h-screen flex items-center justify-center font-['Cinzel'] p-6 text-center text-amber-400" },
            "Verificá que motor_tarot.js y datos_cartas.js estén en la misma carpeta."
          );
        }

        const Layout = window.ArcanaPageLayout;
        if (!Layout) {
          return React.createElement(
            "div",
            { className: "min-h-screen flex items-center justify-center font-['Cinzel'] p-6 text-center text-amber-400" },
            "Error al compilar layout_arcano.js. Revisá la consola con F12."
          );
        }

        return React.createElement(Layout, {
          card: routeData.card,
          neighbors: routeData.neighbors
        });
      }

      const rootEl = document.getElementById("root");
      if (rootEl) {
        const root = ReactDOM.createRoot(rootEl);
        root.render(React.createElement(AppCarta));
      }
    })();
  </script>
